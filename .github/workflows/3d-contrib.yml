name: 🧊 Generate 3D Contribution Graph

# Already self-hosted: the SVG lands in `main` under profile-3d-contrib/, so the
# README references it with a relative path.

on:
  # 每天 UTC 0 点刷新
  schedule:
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 工作流本身有改动时刷新
  push:
    branches:
      - main
    paths:
      - ".github/workflows/3d-contrib.yml"

# ↓ 与 snake / cards 共用同一 concurrency group，串行写 main，避免并发 push 冲突
concurrency:
  group: profile-write-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D contribution
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVG
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: wind-04300

      - name: Commit & Push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p profile-3d-contrib
          git add -A profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ pushed (attempt $i)"
              exit 0
            fi
            echo "⚠️ attempt $i rejected — syncing with remote main…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 5
          done

          echo "❌ push failed after 5 attempts"
          exit 1

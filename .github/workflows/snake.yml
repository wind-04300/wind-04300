name: 🐍 Generate Contribution Snake

# The snake is now committed into `main` under assets/snake/ so the README can
# reference it with a RELATIVE path. Relative paths are served by GitHub itself,
# which keeps the animation working even where raw.githubusercontent.com is
# unreliable.

on:
  # 每 12 小时自动刷新一次
  schedule:
    - cron: "0 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 工作流本身有改动时刷新
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: wind-04300
          outputs: |
            assets/snake/snake-dark.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            assets/snake/snake.svg

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/snake
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(snake): refresh contribution snake"
            git push
          fi

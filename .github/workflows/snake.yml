name: 🐍 Generate Contribution Snake

# The snake is now committed into `main` under assets/snake/ so the README can
# reference it with a RELATIVE path. Relative paths are served by GitHub itself,
# which keeps the animation working even where raw.githubusercontent.com is
# unreliable.

on:
  # 每 12 小时自动刷新一次
  schedule:
    - cron: "0 */12 * * *"
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 工作流本身有改动时刷新
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

# ↓ snake / 3d-contrib / cards 三个工作流都会往 main 提交，共用同一个
#   concurrency group 串行排队，避免并发 push 互相顶掉（曾导致 push 被拒）。
concurrency:
  group: profile-write-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: wind-04300
          outputs: |
            assets/snake/snake-dark.svg?palette=github-dark&color_snake=#00F7FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            assets/snake/snake.svg

      - name: Commit & push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "── 生成结果 ──"
          ls -la assets/snake || echo "⚠️ assets/snake 不存在（生成步骤可能失败）"

          mkdir -p assets/snake
          git add -A assets/snake
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(snake): refresh contribution snake"

          # 远端 main 可能已被其它工作流推进 —— 先 rebase 再重试推送
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "✅ pushed (attempt $i)"
              exit 0
            fi
            echo "⚠️ attempt $i rejected — syncing with remote main…"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 5
          done

          echo "❌ push failed after 5 attempts"
          exit 1

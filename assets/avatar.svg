<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Neon cyberpunk avatar: girl with glasses and ponytail">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#16294A"/>
      <stop offset="58%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#04060C"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#7B2FFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152B4E"/>
      <stop offset="100%" stop-color="#0A1225"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#241546"/>
      <stop offset="55%" stop-color="#170E2E"/>
      <stop offset="100%" stop-color="#0E0820"/>
    </linearGradient>
    <clipPath id="circleClip"><circle cx="160" cy="160" r="148"/></clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ① 背景 -->
  <circle cx="160" cy="160" r="148" fill="url(#bg)"/>
  <circle cx="160" cy="160" r="148" fill="url(#halo)"/>

  <g clip-path="url(#circleClip)">

    <!-- ② 背景光柱 -->
    <g opacity="0.5" filter="url(#soft)">
      <rect x="46" y="0" width="26" height="320" fill="#00F7FF" opacity="0.10">
        <animate attributeName="opacity" values="0.05;0.20;0.05" dur="5.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="250" y="0" width="26" height="320" fill="#FF00E5" opacity="0.12">
        <animate attributeName="opacity" values="0.18;0.04;0.18" dur="6.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ③ 身体 -->
    <path d="M58 320 C 64 266 106 238 160 238 C 214 238 256 266 262 320 Z" fill="url(#cloth)" stroke="#00F7FF" stroke-width="1.8" stroke-opacity="0.75"/>
    <path d="M138 240 C 146 260 152 268 160 268 C 168 268 174 260 182 240" fill="none" stroke="#00F7FF" stroke-width="1.6" stroke-opacity="0.55"/>
    <path d="M124 252 L 160 286 L 196 252" fill="none" stroke="#FF00E5" stroke-width="1.4" stroke-opacity="0.6"/>

    <!-- ④ 脖子 -->
    <path d="M142 186 L 178 186 L 178 226 Q 160 238 142 226 Z" fill="#E9C0AC"/>
    <path d="M142 186 L 178 186 L 178 200 Q 160 212 142 200 Z" fill="#CFA28E" opacity="0.75"/>

    <!-- ⑤ 后层头发 -->
    <ellipse cx="160" cy="148" rx="57" ry="63" fill="url(#hairG)"/>

    <!-- ⑥ 高马尾 -->
    <g transform="translate(206,84)">
      <animateTransform attributeName="transform" type="rotate" values="-5 206 84;6 206 84;-5 206 84" dur="3.8s" repeatCount="indefinite" additive="replace"/>
      <path d="M0 0 C 40 -10, 68 16, 72 58 C 76 98, 62 138, 40 168 C 48 132, 52 96, 44 68 C 36 40, 20 14, 0 0 Z" fill="url(#hairG)" stroke="#8A6BFF" stroke-width="1.3" stroke-opacity="0.55"/>
      <path d="M12 12 C 40 6, 58 30, 60 62 C 62 92, 52 122, 38 146" fill="none" stroke="#00F7FF" stroke-width="1.2" stroke-opacity="0.45"/>
      <ellipse cx="4" cy="6" rx="8" ry="10" fill="#FF00E5" opacity="0.9" transform="rotate(28 4 6)"/>
      <ellipse cx="4" cy="6" rx="8" ry="10" fill="none" stroke="#FFB3F3" stroke-width="1.2" transform="rotate(28 4 6)"/>
    </g>

    <!-- ⑦ 耳朵 -->
    <ellipse cx="112" cy="154" rx="9" ry="13" fill="#E9C0AC"/>
    <ellipse cx="208" cy="154" rx="9" ry="13" fill="#E9C0AC"/>

    <!-- ⑧ 脸 -->
    <ellipse cx="160" cy="150" rx="48" ry="54" fill="#F4D7C8"/>

    <!-- ⑨ 刘海 -->
    <path d="M160 68 C 116 68, 100 110, 104 154 C 106 152, 112 122, 126 110 C 140 98, 160 96, 160 96 C 160 96, 180 98, 194 110 C 208 122, 214 152, 216 154 C 220 110, 204 68, 160 68 Z" fill="url(#hairG)"/>
    <path d="M120 106 C 134 94, 152 90, 160 90" fill="none" stroke="#8A6BFF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
    <path d="M200 106 C 186 94, 168 90, 160 90" fill="none" stroke="#00F7FF" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- ⑩ 眉毛 -->
    <path d="M122 128 Q 136 122 149 128" fill="none" stroke="#2A1A48" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M171 128 Q 184 122 198 128" fill="none" stroke="#2A1A48" stroke-width="3.2" stroke-linecap="round"/>

    <!-- ⑪ 腮红 -->
    <ellipse cx="124" cy="174" rx="11" ry="6" fill="#FF7FB0" opacity="0.32"/>
    <ellipse cx="196" cy="174" rx="11" ry="6" fill="#FF7FB0" opacity="0.32"/>

    <!-- ⑫ 眼睛（带眨眼） -->
    <g transform="translate(136,153)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1;1 1" keyTimes="0;0.45;0.5;0.55;1" dur="4.8s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="7.5" ry="10" fill="#251543"/>
        <circle cx="2.6" cy="-4.2" r="2.8" fill="#00F7FF"/>
        <circle cx="-2.4" cy="3.6" r="1.5" fill="#FF00E5" opacity="0.85"/>
      </g>
    </g>
    <g transform="translate(184,153)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.08;1 1;1 1" keyTimes="0;0.45;0.5;0.55;1" dur="4.8s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="7.5" ry="10" fill="#251543"/>
        <circle cx="2.6" cy="-4.2" r="2.8" fill="#00F7FF"/>
        <circle cx="-2.4" cy="3.6" r="1.5" fill="#FF00E5" opacity="0.85"/>
      </g>
    </g>

    <!-- ⑬ 眼镜 -->
    <path d="M114 150 L 104 144" stroke="#00F7FF" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M206 150 L 216 144" stroke="#00F7FF" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="136" cy="152" rx="23" ry="20" fill="#0D1117" fill-opacity="0.30" stroke="#00F7FF" stroke-width="2.6"/>
    <ellipse cx="184" cy="152" rx="23" ry="20" fill="#0D1117" fill-opacity="0.30" stroke="#00F7FF" stroke-width="2.6"/>
    <path d="M159 150 L 161 150" stroke="#00F7FF" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="136" cy="152" rx="21" ry="18" fill="none" stroke="#FF00E5" stroke-width="0.8" stroke-opacity="0.5"/>
    <ellipse cx="184" cy="152" rx="21" ry="18" fill="none" stroke="#FF00E5" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- ⑭ 镜片反光扫过 -->
    <g clip-path="url(#circleClip)" opacity="0.5">
      <rect x="-70" y="126" width="16" height="56" fill="#EAFDFF" transform="rotate(18 0 154)">
        <animate attributeName="x" values="-70;340" dur="5.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ⑮ 鼻子 / 嘴 -->
    <path d="M160 168 q 4.5 5 0 7" fill="none" stroke="#D3A490" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M151 185 Q 160 193 169 185" fill="none" stroke="#C9727F" stroke-width="2.8" stroke-linecap="round"/>

    <!-- ⑯ 扫描线 -->
    <rect x="0" y="0" width="320" height="3" fill="#00F7FF" opacity="0.30">
      <animate attributeName="y" values="-10;330" dur="6.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="320" height="1.4" fill="#FF00E5" opacity="0.28">
      <animate attributeName="y" values="-20;330" dur="9.1s" begin="1.4s" repeatCount="indefinite"/>
    </rect>

    <!-- ⑰ 底部全息光晕 -->
    <ellipse cx="160" cy="304" rx="86" ry="11" fill="#00F7FF" opacity="0.40" filter="url(#soft)">
      <animate attributeName="opacity" values="0.18;0.58;0.18" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="74;98;74" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ⑱ 霓虹电子雨（头像内） -->
    <g opacity="0.55">
      <rect x="34" y="-60" width="2" height="70" fill="#00F7FF" rx="1"><animate attributeName="y" from="-70" to="330" dur="3.6s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="286" y="-60" width="2" height="90" fill="#FF00E5" rx="1"><animate attributeName="y" from="-90" to="330" dur="4.4s" begin="1.1s" repeatCount="indefinite"/></rect>
      <rect x="72" y="-60" width="1.6" height="60" fill="#00FFA3" rx="1"><animate attributeName="y" from="-60" to="330" dur="5.2s" begin="2.3s" repeatCount="indefinite"/></rect>
      <rect x="248" y="-60" width="1.6" height="76" fill="#9D4EDD" rx="1"><animate attributeName="y" from="-76" to="330" dur="4.8s" begin="0.7s" repeatCount="indefinite"/></rect>
    </g>

  </g>

  <!-- ⑲ 外圈双环 -->
  <circle cx="160" cy="160" r="152" fill="none" stroke="#00F7FF" stroke-width="1.6" stroke-dasharray="5 12" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate" from="0 160 160" to="360 160 160" dur="22s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="160" r="143" fill="none" stroke="#FF00E5" stroke-width="1.2" stroke-dasharray="2 20" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="360 160 160" to="0 160 160" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="160" r="148" fill="none" stroke="#00F7FF" stroke-width="2.2" opacity="0.65">
    <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
